name: Actualitza i publica

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data d'avui (Madrid)
        id: day
        run: echo "date=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_OUTPUT"

      - name: Recupera els horaris del dia
        id: cache
        uses: actions/cache@v4
        with:
          path: data/schedule.json
          key: schedule-${{ steps.day.outputs.date }}-${{ hashFiles('config.json', 'scripts/build_schedule.py') }}

      - name: Construeix els horaris (un cop al dia)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/build_schedule.py

      - name: Baixa les dades en temps real
        run: python scripts/fetch_live.py

      - name: Prepara el web
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/schedule.json data/live.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
